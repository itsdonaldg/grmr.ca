          enabled: true
          title: Donald Isaac Grimmer
          subtitle: "I am a civil engineering graduate of UBC Okanagan and an Engineer in Training with Engineers and Geoscientists BC, working as a project coordinator in aggregate supply, ready-mix concrete, soil disposal, and heavy civil earthworks across British Columbia. My work runs from mine and land-use permitting through health and safety systems to the automation that reports on site operations. On this website you can find my curriculum vitae, personal projects, and contact information."
